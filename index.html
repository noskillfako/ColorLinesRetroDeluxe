<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=900, user-scalable=no">
    <title>Modern Color Lines</title>
    <meta name="description" content="A modernized, responsive web version of the classic Color Lines game.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Game Screen (Hidden initially) -->
    <div id="game-container" class="hidden">
        <!-- Top Bar: Next Colors and Action Buttons -->
        <header id="top-bar">
            <div class="score-display glass-panel">
                <span class="label">SCORE</span>
                <span id="current-score" class="value">0</span>
            </div>

            <div class="next-colors-container glass-panel">
                <span class="label">NEXT</span>
                <div id="next-colors" class="next-colors-slots">
                    <div class="ball-slot"></div>
                    <div class="ball-slot"></div>
                    <div class="ball-slot"></div>
                </div>
            </div>

            <div class="top-controls glass-panel">
                <button id="btn-sound" class="btn" aria-label="Toggle Sound">🔊</button>
                <button id="btn-leaderboard" class="btn" aria-label="Leaderboard">🏆</button>
            </div>
        </header>

        <!-- Main Game Area -->
        <main id="main-area">
            <!-- Left Character Panel -->
            <aside class="side-panel left-panel">
                <div class="character-name" id="alisa-name">Alisa</div>
                <div class="pillar-wrapper">
                    <div class="character-img" id="char-alisa"></div>
                    <div class="pillar" id="pillar-alisa"></div>
                </div>
                <div class="panel-stats glass-panel">
                    <div class="stat-row">
                        <span>Best</span>
                        <span id="best-score" class="highlight">0</span>
                    </div>
                </div>
            </aside>

            <!-- Game Board -->
            <div class="board-wrapper">
                <div id="game-board">
                    <!-- 9x9 Grid will be injected here via JS -->
                </div>

                <!-- Game Over Overlay -->
                <div id="game-over-modal" class="modal hidden">
                    <div class="modal-content glass-panel">
                        <h2>Game Over</h2>
                        <p>Your Score: <span id="final-score" class="highlight">0</span></p>
                        <div class="input-group">
                            <input type="text" id="player-name" placeholder="Enter your name" maxlength="15">
                        </div>
                        <button id="btn-submit-score" class="btn primary-btn">Submit Score & Restart</button>
                        <button id="btn-restart-only" class="btn secondary-btn">Play Again</button>
                    </div>
                </div>
            </div>

            <!-- Right Character Panel -->
            <aside class="side-panel right-panel">
                <div class="character-name">Pretender</div>
                <div class="pillar-wrapper">
                    <div class="character-img" id="char-pretender"></div>
                    <div class="pillar" id="pillar-pretender"></div>
                </div>
                <div class="panel-controls glass-panel">
                    <button id="btn-menu" class="btn secondary-btn full-width"
                        style="margin-bottom: 10px;">Menu</button>
                    <button id="btn-restart" class="btn primary-btn full-width">Restart</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Main Menu Modal -->
    <div id="main-menu" class="modal">
        <div class="modal-content glass-panel" style="width: 400px; max-width: 90%;">
            <h1
                style="color: gold; text-align: center; text-shadow: 2px 2px #000; font-family: Arial, sans-serif; font-size: 36px; margin-bottom: 30px;">
                COLOR LINES</h1>

            <div style="margin: 30px 0; display: flex; flex-direction: column; gap: 15px;">
                <label style="font-size: 14px; text-transform: uppercase;">Zorluk Seçimi:</label>
                <select id="difficulty-select" class="btn"
                    style="width: 100%; text-align: center; font-size: 16px; padding: 10px;">
                    <option value="easy">Kolay (Easy)</option>
                    <option value="medium" selected>Orta (Medium)</option>
                    <option value="hard">Zor (Hard)</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <button id="btn-start-game" class="btn primary-btn full-width"
                    style="font-size: 18px; padding: 15px;">OYUNA BAŞLA</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 20px;">
                <button id="btn-menu-sound" class="btn" aria-label="Toggle Sound"
                    style="font-size: 24px; padding: 10px 20px;">🔊</button>
                <button id="btn-menu-leaderboard" class="btn" aria-label="Leaderboard"
                    style="font-size: 24px; padding: 10px 20px;">🏆</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <button id="btn-close-leaderboard" class="close-btn">×</button>
            <h2 style="font-family: Arial, sans-serif; color: gold; text-shadow: 1px 1px 0 #000;">Global Leaderboard
            </h2>
            <ul id="leaderboard-list">
                <li>Loading...</li>
            </ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/pathfinder.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
</body>

</html>
